name: ci
# Runs both check batteries on every pull request, on pushes to main, and by hand.
# The batteries exit 1 on any FAIL, so a red run means a required behaviour broke.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  batteries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest version pyproject.toml allows; 3.13 is the newest tested.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Battery I (core, adversarial, robustness, spec, product claims)
        run: python battery.py
      - name: Battery II (anchor round-trip, writer, package and CLI)
        run: python battery2.py
